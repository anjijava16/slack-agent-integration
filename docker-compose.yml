# Local stacks.
#   make qdrant                              Qdrant only (the app runs on your machine with `make run`)
#   docker compose up --build                app + Qdrant, app on SQLite
#   docker compose --profile pg up --build   app + Qdrant + PostgreSQL (rehearse the cloud setup)
services:
  agent:
    build: .
    image: slack-langgraph-agent:local
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-sqlite:////tmp/data/agent.db}
      QDRANT_MODE: local
      QDRANT_URL: http://qdrant:6333        # the service name, not localhost, inside compose
    ports:
      - "8000:8080"
    volumes:
      - agentdata:/tmp/data
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0           # keep within one minor version of qdrant-client
    ports:
      - "6333:6333"                         # REST + dashboard: http://localhost:6333/dashboard
      - "6334:6334"                         # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    restart: unless-stopped

  postgres:
    profiles: ["pg"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agentdata:
  qdrantdata:
  pgdata:
