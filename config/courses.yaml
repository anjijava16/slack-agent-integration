# Courses the FAQ bot knows about. One Qdrant collection per course
# (<QDRANT_COLLECTION_PREFIX><key>, e.g. "faq_llm" locally, "test_faq_llm" on Cloud Run).
#
# channels         Slack channels where an @mention is answered from THIS course's
#                  materials (RAG). Mentions anywhere else go to the general agent,
#                  which can still search courses through its search_course_materials tool.
# slack_ingest     channels whose recent threads are indexed (slack_days back)
# faq_dir          folder under _questions/ in github.com/DataTalksClub/faq
# repos            course GitHub repos to index (include/exclude filters optional)
# youtube_videos   video ids whose transcripts are indexed
#
# Channel ids below are the DataTalks.Club workspace ids used by the original
# faq-slack-bot. In your own workspace, replace them with yours
# (channel name -> View channel details -> bottom of the About tab).
courses:
  de:
    name: Data Engineering Zoomcamp
    short_name: DE
    cohort_year: 2026
    course_start_date: 12 January 2026
    channels: [C01FABYF2RG, C06CBSE16JC, C06BZJX8PSP]
    slack_ingest: [C01FABYF2RG]
    slack_days: 90
    faq_dir: data-engineering-zoomcamp
    repos:
      - owner: DataTalksClub
        repo: data-engineering-zoomcamp
        branch: main
        exclude_dirs: [.github, images, cohorts/2022, cohorts/2023, cohorts/2024]
    youtube_videos: [X8cEEwi8DTM]

  ml:
