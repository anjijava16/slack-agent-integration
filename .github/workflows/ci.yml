# CI: every PR and every push. Needs no GCP credentials and no LLM key — tests use a
# scripted fake model, a real PostgreSQL service container, and SQLite.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [develop] # develop is covered by cd.yml, which runs this workflow first
  workflow_call: # cd.yml reuses these jobs as its quality gate

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Turns on the Postgres-backed tests (store, checkpointer, restart round-trip)
      TEST_DATABASE_URL: postgresql://agent:agent@localhost:5432/agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests examples

      - name: Ruff format check
        run: ruff format --check app tests examples

      - name: Shellcheck scripts
        run: shellcheck -x -S warning scripts/*.sh

      - name: Pytest
        run: pytest -q --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  terraform:
    name: Terraform fmt, validate & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: terraform fmt
        run: terraform fmt -check -recursive infra

      - name: platform — validate + mocked tests
        working-directory: infra/platform
        run: terraform init -backend=false -input=false && terraform validate && terraform test

      - name: cloudrun — validate + mocked tests
        working-directory: infra/cloudrun
        run: terraform init -backend=false -input=false && terraform validate && terraform test

  docker:
    name: Docker build & boot (no push)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: slack-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container boots (SQLite, in-memory Qdrant, baked models, no network for models)
        run: |
          # HF_HUB_OFFLINE proves the embedding model was baked into the image.
          docker run -d --name app -p 8080:8080 -e LLM_API_KEY=ci-dummy -e QDRANT_MODE=memory \
            -e HF_HUB_OFFLINE=1 slack-agent:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              echo; curl -fsS http://localhost:8080/ready && break
            fi
            sleep 1
          done
          # RAG end to end inside the container: ingest a snippet, search it with the real model.
          curl -fsS -X POST http://localhost:8080/api/ingest/text -H 'Content-Type: application/json' \
            -d '{"course":"llm","title":"CI","text":"Office hours are on Thursdays at 17:00 CET."}'
          echo
          curl -fsS -X POST http://localhost:8080/api/rag/search -H 'Content-Type: application/json' \
            -d '{"course":"llm","query":"when are office hours?"}' | tee /tmp/search.json
          grep -q "Thursdays" /tmp/search.json || { docker logs app; exit 1; }
