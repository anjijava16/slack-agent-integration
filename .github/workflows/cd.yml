# CD: push to develop (or run it by hand from develop) ->
#   1. CI (reused from ci.yml)
#   2. build the image once, push to Artifact Registry (+ Docker Hub if configured)
#   3. deploy it to the TEST environment (Cloud Run slack-agent-test + Cloud SQL db slack_agent_test)
#   4. if DEPLOY_PROD == "true" (or ticked on a manual run): deploy the SAME image to PROD,
#      through the GitHub environment "production" (add required reviewers there for an approval gate)
#
# Repository VARIABLES (scripts/github-setup.sh sets them):
#   GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOYER_SA GCP_RUNTIME_SA GAR_REPOSITORY
#   CLOUDSQL_CONNECTION_NAME TF_STATE_BUCKET SERVICE_NAME
#   optional: LLM_MODEL SLACK_MODE SLACK_CHANNEL_ID REQUIRE_API_KEY DEPLOY_PROD
#             MIN_INSTANCES MAX_INSTANCES DOCKERHUB_REPO
# Repository SECRETS (only for Docker Hub): DOCKERHUB_USERNAME DOCKERHUB_TOKEN
# Google credentials: none stored. Workload Identity Federation trusts this repo's develop branch.
# App secrets (OpenRouter, Slack, DB URL): Secret Manager, read by Cloud Run at runtime.
name: CD

on:
  push:
    branches: [develop] # must match GITHUB_BRANCH in scripts/config.sh (GCP only trusts this branch)
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: "Also deploy to prod after test"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # mint the OIDC token that Workload Identity Federation exchanges

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE: ${{ vars.SERVICE_NAME || 'slack-agent' }}
  GAR_REPO: ${{ vars.GAR_REPOSITORY || 'slack-agent' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.ref }}
    steps:
      - uses: actions/checkout@v5

      - name: Check required variables
        run: |
          missing=0
          for v in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_DEPLOYER_SA GCP_RUNTIME_SA TF_STATE_BUCKET CLOUDSQL_CONNECTION_NAME; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v is not set (run scripts/github-setup.sh)"; missing=1; fi
          done
          exit $missing
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
          GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          CLOUDSQL_CONNECTION_NAME: ${{ vars.CLOUDSQL_CONNECTION_NAME }}

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Compute image tags
        id: img
        run: |
          base="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPO}/${SERVICE}"
          echo "ref=$base:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$base:${GITHUB_SHA::12}"
            echo "$base:latest"
            if [ -n "$DOCKERHUB_REPO" ]; then
              echo "docker.io/$DOCKERHUB_REPO:${GITHUB_SHA::12}"
              echo "docker.io/$DOCKERHUB_REPO:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}

      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_REPO != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push (Artifact Registry + optional Docker Hub)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # Cloud Run runs amd64
          push: true
          tags: ${{ steps.img.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-test:
    name: Deploy test
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      env: test
      github_environment: test
      image: ${{ needs.build.outputs.image }}
    secrets: inherit

  deploy-prod:
    name: Deploy prod
    needs: [build, deploy-test]
    if: ${{ vars.DEPLOY_PROD == 'true' || inputs.deploy_prod }}
    uses: ./.github/workflows/deploy.yml
    with:
      env: prod
      github_environment: production
      image: ${{ needs.build.outputs.image }}
    secrets: inherit
